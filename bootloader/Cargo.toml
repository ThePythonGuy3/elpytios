cargo-features = ['per-package-target']

[package]
name = "elpytios-bootloader"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"

forced-target = "x86_64-unknown-uefi"

[dependencies]
elpytios-elf = { path = "../elf" }
elpytios-bootinfo = { path = "../bootinfo" }

arrayvec = { version = "0.7", default-features = false }
const_panic = { version = "0.2", features = ["derive", "rust_latest_stable"] }
uefi = { version = "0.38", features = ["logger", "panic_handler"] }
