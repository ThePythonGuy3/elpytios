cargo-features = ['per-package-target']

[package]
name = "elpytios-kernel"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"

forced-target = "x86_64-unknown-none"

[dependencies]
elpytios-abi = { path = "../abi" }
elpytios-bootinfo = { path = "../bootinfo" }

derive_more = { version = "2", default-features = false, features = [
    "display",
] }
nonmax = { version = "0.5", default-features = false }
